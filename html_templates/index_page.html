<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>{folder_name}</title>
<style>
body {
    background: #000;
    color: #fff;
    font-family: sans-serif;
}

ul {
    list-style: none;
    padding: 20px;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 15px;
    justify-items: center;
}

li {
    background: #111;
    border-radius: 8px;
    overflow: hidden;
    text-align: center;
}

.video-thumb {
    width: 100%;
    aspect-ratio: 16/9;
    object-fit: cover;
    background: #000;
}

.folder-thumb {
    width: 100%;
    aspect-ratio: 16/9;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    background: #111;
    color: #fff;
}

#search-container {
    position: relative;
    width: 280px;
    margin: 100px auto 12px auto;
}

#search {
    display: block;
    width: 280px;
    padding: 8px 12px;
    background: #fff;
    color: #000;
    border-radius: 6px;
    border: 1px solid #444;
}

#search-suggestions {
    position: absolute;
    top: 100%;
    left: 0;
    width: 100%;
    max-height: 150px;
    overflow-y: auto;
    background: #222;
    color: #fff;
    z-index: 1000;
}

#search-suggestions div {
    padding: 6px 10px;
    cursor: pointer;
}

#search-suggestions div:hover {
    background: #444;
}

#back-to-top {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 80px;
    height: 80px;
    background: #111;
    color: #524d5e;
    border: none;
    border-radius: 12px;
    font-size: 28px;
}

#back-to-top:hover {
    background: rgba(255, 255, 255, 0.3);
    color: rgba(0,0,0,0.35);
    cursor: pointer;
}

.item-name {
    margin: 6px 0;
    font-size: 14px;
    color: #fff;
}
</style>
</head>

<body>

<button id="back-to-top">↑</button>

<div id="search-container">
    <input
        id="search"
        type="text"
        placeholder="搜尋影片"
        onkeydown="search(event)"
    >
    <div id="search-suggestions"></div>
</div>

<ul>

<script>
const searchInput = document.getElementById("search");
const suggestions = document.getElementById("search-suggestions");
const allVideos = {{ALL_VIDEOS}};
const backToTop = document.getElementById("back-to-top");

backToTop.addEventListener("click", () => {
    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
});

searchInput.addEventListener("input", () => {
    const value = searchInput.value.trim().toLowerCase();

    suggestions.innerHTML = "";

    if (!value) {
        return;
    }

    const results = allVideos.filter(video =>
        video.name.toLowerCase().includes(value)
    );

    for (const video of results) {
        const div = document.createElement("div");

        div.textContent = video.name;

        div.onclick = () => {
            searchInput.value = video.name;
            sessionStorage.setItem("videoSearch", video.name);
            window.location.href = "search.html";
        };

        suggestions.appendChild(div);
    }
});

function search(event) {
    if (event.key !== "Enter") {
        return;
    }

    const value = document.getElementById("search").value.trim();

    if (!value) {
        return;
    }

    sessionStorage.setItem("videoSearch", value);
    window.location.href = "search.html";
}
</script>
</body>
</html>
